<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fff3e0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Pet Clinic Rush</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #f6e2ca;
        font-family: "Baloo 2", "Nunito", Arial, sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: stretch;
        justify-content: stretch;
        touch-action: none;
      }
      #game canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(160deg, #fff3e0 0%, #ffe1e8 100%);
        color: #4a3b53;
        transition: opacity 0.35s ease;
        z-index: 10;
      }
      #boot-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .paw {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        background: #8ed6c4;
        position: relative;
        box-shadow: 0 10px 0 #69bda9;
        animation: bob 1.1s ease-in-out infinite;
      }
      #boot-splash .paw::before {
        content: "";
        position: absolute;
        inset: 30px;
        border-radius: 50%;
        background: #fff8ee;
      }
      #boot-splash h1 {
        margin: 0;
        font-size: 30px;
        letter-spacing: 0.4px;
      }
      #boot-splash p {
        margin: 0;
        font-size: 17px;
        opacity: 0.6;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0) rotate(-6deg);
        }
        50% {
          transform: translateY(-12px) rotate(6deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-splash">
      <div class="paw"></div>
      <h1>Pet Clinic Rush</h1>
      <p>Opening the clinic...</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
